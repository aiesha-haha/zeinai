# Local run on your own computer (no Cloudflare tunnel, nothing touches zeinai.kz).
#
#   docker compose -f docker-compose.local.yml up -d --build
#
# Site:     http://localhost:3005
# API:      http://localhost:8000/api/v1   (Swagger: http://localhost:8000/swagger/index.html)
# RabbitMQ: http://localhost:15672
#
# Uses the same .env as production, so AI calls spend the real OpenAI / Kimi balance.

name: zeinai-local

services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "3005:3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - APP_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/firebase-credentials.json:/app/firebase-credentials.json
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  # All AI generation workers (KMJ, tests, games, AI studio images/videos, ...)
  worker:
    build: ./backend
    env_file:
      - ./.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
    command: /app/kmj_worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend/firebase-credentials.json:/app/firebase-credentials.json
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:alpine
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  local_postgres_data:
